# Statically link the mingw CRT so a Windows exe does not need libgcc or
# winpthread beside it. The linker itself is chosen by the host toolchain.
# build.sh sets the Linux cross linker only for the Windows cross build.
# System libraries (kernel32, user32, gdi32) stay dynamic.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "target-feature=+crt-static"]
